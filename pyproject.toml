# Version: 0.1.0 | 2026-11-02
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-wrath"
version = "0.1.0"
description = "The Cradle Plateau: The Wrath of Doctor Voss"
requires-python = ">=3.12,<3.13"
dependencies = ["tcod>=16,<17"]

[project.optional-dependencies]
dev = ["pytest>=8"]
release = ["pyinstaller>=6"]

[project.scripts]
cradle = "cradle.main:main"
cradle-content-check = "cradle.platform.contentload:check_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cradle = ["content/**/*.json", "content/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
